[package]
name = "ctui"
version = "0.1.0"
edition = "2024"
description = "Minimal terminal calendar and task list, as a TUI and a CLI"
publish = false
readme = "README.md"
keywords = ["calendar", "todo", "tui", "icalendar", "ratatui"]
categories = ["command-line-utilities"]

[features]
# The Monkeytype-derived themes are GPL-3.0 (themes/MONKEYTYPE.md). Off by
# default so they're only compiled in when the build opts in; without it they
# load from a themes folder at run time (DESIGN.md §16).
monkeytype-themes = []

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
crossterm = "0.29.0"
directories = "6.0.0"
iana-time-zone = "0.1.65"
ratatui = "0.30.2"
rrule = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
uuid = { version = "1.28.0", features = ["v4"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
all = "warn"
