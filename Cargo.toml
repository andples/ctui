[package]
name = "ctui"
version = "0.2.2"
edition = "2024"
# Oldest Rust that builds ctui (ratatui needs 1.88). CI checks it.
rust-version = "1.88"
description = "Minimal terminal calendar and task list, as a TUI and a CLI"
license = "MIT"
repository = "https://github.com/andples/ctui"
readme = "README.md"
keywords = ["calendar", "todo", "tui", "icalendar", "ratatui"]
categories = ["command-line-utilities", "date-and-time"]
# The published crate holds the code and the MIT/own themes only. The
# Monkeytype themes (GPL-3.0) stay in the repo's themes/ folder.
include = [
    "src/**",
    "agents/SKILL.md",
    "themes/default.toml",
    "themes/light.toml",
    "themes/catppuccin-latte.toml",
    "themes/catppuccin-mocha.toml",
    "themes/dracula.toml",
    "themes/everforest.toml",
    "themes/gruvbox.toml",
    "themes/kanagawa.toml",
    "themes/nord.toml",
    "themes/one-dark.toml",
    "themes/rose-pine.toml",
    "themes/solarized-dark.toml",
    "themes/solarized-light.toml",
    "themes/tokyo-night.toml",
    "themes/CREDITS.md",
    "README.md",
    "LICENSE",
]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
crossterm = "0.29.0"
directories = "6.0.0"
iana-time-zone = "0.1.65"
ratatui = "0.30.2"
rrule = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
uuid = { version = "1.10", features = ["v4"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Live themes from utheme (`src/utheme_client.rs`) are macOS-only, and so is
# their file watcher: other platforms build exactly as before.
[target.'cfg(target_os = "macos")'.dependencies]
notify = "8.2.0"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.clippy]
all = "warn"
