# Colours from the gruvbox palette (https://github.com/morhetz/gruvbox).
# The list colours are its accent colours. See themes/CREDITS.md.
name = "gruvbox"

[colors]
bg    = "#282828"
fg    = "#ebdbb2"
sub   = "#928374"
main  = "#d79921"
