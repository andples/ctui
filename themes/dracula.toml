# Colours from the Dracula palette (https://github.com/dracula/dracula-theme).
# The list colours are its accent colours. See themes/CREDITS.md.
name = "dracula"

[colors]
bg    = "#282a36"
fg    = "#f8f8f2"
sub   = "#6272a4"
main  = "#bd93f9"
